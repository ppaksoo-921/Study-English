<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>영단어 터치 퀴즈</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --accent: #2563eb;
      --border: #dbe3f0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 16px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 22px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 16px 12px;
      justify-content: center;
      align-items: center;
    }

    .file-label, button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      color: var(--text);
    }

    .file-label {
      display: inline-block;
    }

    input[type="file"] {
      display: none;
    }

    button:hover, .file-label:hover {
      border-color: var(--accent);
    }

    .status {
      text-align: center;
      padding: 0 16px 12px;
      color: var(--sub);
      font-size: 14px;
      min-height: 20px;
    }

    .card-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 8px 16px 20px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      user-select: none;
      cursor: pointer;
      min-height: 60vh;
    }

    .mode {
      font-size: 14px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .content {
      font-size: clamp(28px, 6vw, 54px);
      line-height: 1.35;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: var(--sub);
    }

    .footer {
      padding: 0 16px 20px;
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>영단어 터치 퀴즈</header>

  <div class="controls">
    <label class="file-label" for="csvFile">CSV 불러오기</label>
    <input id="csvFile" type="file" accept=".csv,text/csv" />
    <button id="shuffleBtn" type="button">새로 섞기</button>
  </div>

  <div class="status" id="status">CSV 파일을 먼저 불러오세요.</div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="mode" id="mode">안내</div>
      <div class="content" id="content">CSV를 불러오면
영어 문제가 시작됩니다.</div>
      <div class="hint">카드를 터치하면 문제 → 정답 → 다음 문제 순서로 진행됩니다.</div>
    </div>
  </div>

  <div class="footer">
    CSV 형식 예시:<br>
    apple,사과<br>
    banana,바나나
  </div>

  <script>
    const fileInput = document.getElementById('csvFile');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const card = document.getElementById('card');
    const modeEl = document.getElementById('mode');
    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('status');

    let vocabList = [];
    let deck = [];
    let current = null;
    let showingAnswer = false;
    let solvedCount = 0;

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        const next = line[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSVText(text) {
      const lines = text
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter(line => line.trim() !== '');

      const pairs = [];

      for (const line of lines) {
        const cells = parseCSVLine(line).map(cell => cell.trim());

        for (let i = 0; i < cells.length; i += 2) {
          const word = cells[i];
          const meaning = cells[i + 1];

          if (!word || !meaning) continue;
          pairs.push({ word, meaning });
        }
      }

      return pairs;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function refillDeck() {
      deck = shuffle([...vocabList]);
    }

    function nextQuestion() {
      if (vocabList.length === 0) {
        modeEl.textContent = '안내';
        contentEl.textContent = 'CSV 파일을 먼저 불러오세요.';
        statusEl.textContent = '단어 데이터가 없습니다.';
        current = null;
        showingAnswer = false;
        return;
      }

      if (deck.length === 0) {
        refillDeck();
      }

      current = deck.pop();
      showingAnswer = false;

      modeEl.textContent = '문제';
      contentEl.textContent = current.word;
      statusEl.textContent = `총 ${vocabList.length}개 단어 | 현재까지 정답 확인 ${solvedCount}회`;
    }

    function showAnswer() {
      if (!current) return;
      showingAnswer = true;
      modeEl.textContent = '정답';
      contentEl.textContent = current.meaning;
      solvedCount++;
      statusEl.textContent = `총 ${vocabList.length}개 단어 | 현재까지 정답 확인 ${solvedCount}회`;
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          const text = event.target.result;
          const parsed = parseCSVText(text);

          if (parsed.length === 0) {
            alert('읽을 수 있는 단어/뜻 쌍이 없습니다. CSV 형식을 확인해주세요.');
            return;
          }

          vocabList = parsed;
          solvedCount = 0;
          refillDeck();
          nextQuestion();
        } catch (err) {
          console.error(err);
          alert('CSV 파일을 읽는 중 오류가 발생했습니다.');
        }
      };

      reader.readAsText(file, 'UTF-8');
    });

    shuffleBtn.addEventListener('click', () => {
      if (vocabList.length === 0) {
        alert('먼저 CSV 파일을 불러오세요.');
        return;
      }
      refillDeck();
      solvedCount = 0;
      nextQuestion();
    });

    card.addEventListener('click', () => {
      if (!current) return;

      if (!showingAnswer) {
        showAnswer();
      } else {
        nextQuestion();
      }
    });
  </script>
</body>
</html>
