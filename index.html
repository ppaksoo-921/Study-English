<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>영단어 터치 퀴즈</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --accent: #2563eb;
      --border: #dbe3f0;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 16px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 22px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 16px 12px;
      justify-content: center;
      align-items: center;
    }

    .file-label, button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      color: var(--text);
    }

    .file-label {
      display: inline-block;
    }

    input[type="file"] {
      display: none;
    }

    button:hover, .file-label:hover {
      border-color: var(--accent);
    }

    .status {
      text-align: center;
      padding: 0 16px 12px;
      color: var(--sub);
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
    }

    .card-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 8px 16px 20px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      user-select: none;
      cursor: pointer;
      min-height: 60vh;
    }

    .mode {
      font-size: 14px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .content {
      font-size: clamp(28px, 6vw, 54px);
      line-height: 1.35;
      word-break: keep-all;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: var(--sub);
      line-height: 1.5;
    }

    .answer-actions {
      display: none;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
    }

    .answer-actions.show {
      display: flex;
    }

    .answer-actions button {
      flex: 1;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 16px;
    }

    .correct-btn {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #166534;
    }

    .wrong-btn {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #991b1b;
    }

    .footer {
      padding: 0 16px 20px;
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>영단어 터치 퀴즈</header>

  <div class="controls">
    <label class="file-label" for="csvFile">CSV 불러오기</label>
    <input id="csvFile" type="file" accept=".csv,text/csv" />
    <button id="shuffleBtn" type="button">새로 시작</button>
  </div>

  <div class="status" id="status">CSV 파일을 먼저 불러오세요.</div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="mode" id="mode">안내</div>
      <div class="content" id="content">CSV를 불러오면
영어 문제가 시작됩니다.</div>
      <div class="hint" id="hint">카드를 터치하면 문제 → 정답 → 채점 순서로 진행됩니다.</div>
      <div class="answer-actions" id="answerActions">
        <button class="correct-btn" id="correctBtn" type="button">맞췄어요</button>
        <button class="wrong-btn" id="wrongBtn" type="button">틀렸어요</button>
      </div>
    </div>
  </div>

  <div class="footer">
    CSV 형식 예시:<br>
    apple,사과<br>
    banana,바나나<br><br>
    맞춤/틀림/출제 횟수는 저장하지 않으므로 새로고침하면 초기화됩니다.
  </div>

  <script>
    const fileInput = document.getElementById('csvFile');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const card = document.getElementById('card');
    const modeEl = document.getElementById('mode');
    const contentEl = document.getElementById('content');
    const hintEl = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const answerActionsEl = document.getElementById('answerActions');
    const correctBtn = document.getElementById('correctBtn');
    const wrongBtn = document.getElementById('wrongBtn');

    // 틀린 단어가 많을 때 한 번에 다시 볼 오답 비율입니다.
    // 예: 0.5면 오답 중 절반 정도만 우선 후보로 둡니다.
    const WRONG_REVIEW_RATIO = 0.5;

    let vocabList = [];
    let current = null;
    let showingAnswer = false;
    let checkedCount = 0;

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        const next = line[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSVText(text) {
      const lines = text
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter(line => line.trim() !== '');

      const pairs = [];

      for (const line of lines) {
        const cells = parseCSVLine(line).map(cell => cell.trim());

        for (let i = 0; i < cells.length; i += 2) {
          const word = cells[i];
          const meaning = cells[i + 1];

          if (!word || !meaning) continue;
          pairs.push({ word, meaning });
        }
      }

      return pairs;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function hideAnswerButtons() {
      answerActionsEl.classList.remove('show');
    }

    function showAnswerButtons() {
      answerActionsEl.classList.add('show');
    }

    function getStats() {
      const total = vocabList.length;
      const correct = vocabList.filter(item => item.isCorrect).length;
      const wrong = vocabList.filter(item => !item.isCorrect && item.wrongCount > 0).length;
      const remaining = vocabList.filter(item => !item.isCorrect).length;
      const totalShown = vocabList.reduce((sum, item) => sum + item.showCount, 0);

      return { total, correct, wrong, remaining, totalShown };
    }

    function updateStatus(extraText = '') {
      if (vocabList.length === 0) {
        statusEl.textContent = '단어 데이터가 없습니다.';
        return;
      }

      const stats = getStats();
      const baseText = `총 ${stats.total}개 | 맞춘 단어 ${stats.correct}개 | 현재 오답 ${stats.wrong}개 | 남은 단어 ${stats.remaining}개 | 출제 ${stats.totalShown}회 | 채점 ${checkedCount}회`;
      statusEl.textContent = extraText ? `${baseText}\n${extraText}` : baseText;
    }

    function resetProgress() {
      vocabList.forEach(item => {
        item.showCount = 0;
        item.wrongCount = 0;
        item.isCorrect = false;
        item.lastResult = null;
      });

      current = null;
      showingAnswer = false;
      checkedCount = 0;
      hideAnswerButtons();
    }

    function pickNextWord() {
      const eligible = vocabList.filter(item => !item.isCorrect);

      if (eligible.length === 0) {
        return null;
      }

      // 1순위: 아직 맞추지 못한 단어 중 출제 횟수가 가장 적은 단어
      const minShowCount = Math.min(...eligible.map(item => item.showCount));
      let candidates = eligible.filter(item => item.showCount === minShowCount);

      // 2순위: 후보가 오답 단어들뿐이면 그중 일부만 우선 후보로 사용
      const wrongCandidates = candidates.filter(item => item.wrongCount > 0);
      if (wrongCandidates.length > 0) {
        const subsetSize = Math.max(1, Math.ceil(wrongCandidates.length * WRONG_REVIEW_RATIO));
        candidates = shuffle([...wrongCandidates]).slice(0, subsetSize);
      }

      // 같은 출제 횟수끼리는 랜덤으로 골라서 순서가 너무 고정되지 않게 함
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function nextQuestion() {
      if (vocabList.length === 0) {
        modeEl.textContent = '안내';
        contentEl.textContent = 'CSV 파일을 먼저 불러오세요.';
        hintEl.textContent = 'CSV를 불러오면 영어 문제가 시작됩니다.';
        statusEl.textContent = '단어 데이터가 없습니다.';
        current = null;
        showingAnswer = false;
        hideAnswerButtons();
        return;
      }

      const next = pickNextWord();

      if (!next) {
        modeEl.textContent = '완료';
        contentEl.textContent = '모든 단어를 맞췄어요!';
        hintEl.textContent = '다시 연습하려면 새로 시작 버튼을 누르세요.';
        current = null;
        showingAnswer = false;
        hideAnswerButtons();
        updateStatus('맞춘 단어는 더 이상 출제되지 않습니다.');
        return;
      }

      current = next;
      current.showCount++;
      showingAnswer = false;

      modeEl.textContent = '문제';
      contentEl.textContent = current.word;
      hintEl.textContent = '카드를 터치하면 한국어 정답이 나옵니다.';
      hideAnswerButtons();
      updateStatus(`이 단어 출제 횟수: ${current.showCount}회`);
    }

    function showAnswer() {
      if (!current) return;

      showingAnswer = true;
      modeEl.textContent = '정답';
      contentEl.textContent = current.meaning;
      hintEl.textContent = '아래에서 이 단어를 맞췄는지 틀렸는지 선택하세요.';
      showAnswerButtons();
      updateStatus(`현재 단어: ${current.word} | 출제 횟수: ${current.showCount}회 | 틀린 횟수: ${current.wrongCount}회`);
    }

    function markAnswer(isCorrect) {
      if (!current || !showingAnswer) return;

      checkedCount++;

      if (isCorrect) {
        current.isCorrect = true;
        current.lastResult = 'correct';
      } else {
        current.wrongCount++;
        current.lastResult = 'wrong';
      }

      nextQuestion();
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          const text = event.target.result;
          const parsed = parseCSVText(text);

          if (parsed.length === 0) {
            alert('읽을 수 있는 단어/뜻 쌍이 없습니다. CSV 형식을 확인해주세요.');
            return;
          }

          vocabList = parsed.map((item, index) => ({
            id: index,
            word: item.word,
            meaning: item.meaning,
            showCount: 0,
            wrongCount: 0,
            isCorrect: false,
            lastResult: null
          }));

          resetProgress();
          nextQuestion();
        } catch (err) {
          console.error(err);
          alert('CSV 파일을 읽는 중 오류가 발생했습니다.');
        }
      };

      reader.readAsText(file, 'UTF-8');
    });

    shuffleBtn.addEventListener('click', () => {
      if (vocabList.length === 0) {
        alert('먼저 CSV 파일을 불러오세요.');
        return;
      }

      resetProgress();
      nextQuestion();
    });

    card.addEventListener('click', () => {
      if (!current) return;

      if (!showingAnswer) {
        showAnswer();
      }
    });

    correctBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      markAnswer(true);
    });

    wrongBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      markAnswer(false);
    });
  </script>
</body>
</html>
